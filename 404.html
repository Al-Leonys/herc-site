<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Needham Gravity</title>
    <meta name="description" content="The requested page or route could not be located. Return to Needham Gravity Mission Control.">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/favicons/icon-192.png">
    <link rel="shortcut icon" href="assets/favicons/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Share+Tech+Mono&family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" id="ng-base-link" href="css/styles.css">

    <style>
        .error-page-container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 60px 24px;
            background-color: var(--bg-main);
            text-align: center;
        }

        .error-card {
            position: relative;
            z-index: 2;
            max-width: 620px;
            width: 100%;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 56px 40px;
            box-shadow: var(--shadow-main);
        }

        /* AUTHENTIC 4-FLAP MECHANICAL SPLIT-FLAP DISPLAY WITH SLASHED ZERO FONT */
        .split-flap-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 10px auto 28px auto;
            perspective: 1000px;
        }

        .split-flap-tile {
            position: relative;
            width: 64px;
            height: 86px;
            background-color: #0A1C36;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(10, 28, 54, 0.25);
            perspective: 400px;
            font-family: 'Share Tech Mono', 'IBM Plex Mono', monospace;
            font-variant-numeric: slashed-zero;
            font-size: 52px;
            font-weight: 700;
            color: #F3C319;
            user-select: none;
            border: 1px solid rgba(10, 28, 54, 0.35);
        }

        .flap {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            background-color: #0A1C36;
            backface-visibility: hidden;
        }

        .flap span {
            position: absolute;
            left: 0;
            width: 100%;
            height: 86px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: slashed-zero;
        }

        .flap.top-static, .flap.flap-top {
            top: 0;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            transform-origin: bottom center;
        }

        .flap.top-static span, .flap.flap-top span {
            top: 0;
        }

        .flap.bottom-static, .flap.flap-bottom {
            bottom: 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            transform-origin: top center;
        }

        .flap.bottom-static span, .flap.flap-bottom span {
            bottom: 0;
        }

        .center-line {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0, 0, 0, 0.35);
            transform: translateY(-50%);
            z-index: 25;
        }

        /* 3D split-flap folding animations */
        .flap.flap-top.flipping {
            animation: flipTop 0.12s ease-in forwards;
        }

        .flap.flap-bottom.flipping {
            animation: flipBottom 0.12s ease-out 0.05s forwards;
        }

        @keyframes flipTop {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flipBottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .error-title {
            font-size: 28px;
            color: var(--text-primary);
            margin-bottom: 14px;
            font-weight: 700;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
    </style>

    <!-- automatic GitHub Pages client-side path router script -->
    <script>
        (function() {
            // derive the deployment sub-path (e.g. "/herc-site") from the resolved stylesheet URL so this works both at a domain root and under a project sub-path
            var linkEl = document.getElementById('ng-base-link');
            var basePath = linkEl ? linkEl.pathname.replace(/\/css\/styles\.css$/, '') : '';
            window.__NG_BASE_PATH__ = basePath;

            var path = window.location.pathname.replace(/\/$/, '');
            var cleanPath = basePath && path.indexOf(basePath) === 0 ? (path.slice(basePath.length) || '/') : path;
            var validRoutes = ['/about', '/subsystems', '/team', '/meet-team', '/sponsors', '/contact', '/contact-form', '/roadmap', '/resources'];
            if (validRoutes.indexOf(cleanPath) !== -1) {
                sessionStorage.setItem('redirect_route', cleanPath);
                window.location.replace(basePath + '/');
            }
        })();
    </script>
</head>
<body>

    <div class="header-overlay-bar">
        <a href="/" class="logo-link" id="ng-home-logo-link">
            <img src="assets/logo.png" alt="Needham Gravity Logo" class="nav-logo-img">
            <span class="logo-title">NEEDHAM GRAVITY</span>
        </a>

        <a href="/" class="btn btn-primary" id="ng-home-btn-link" style="padding: 9px 20px; font-size: 13px;">
            <i class="fa-solid fa-house"></i> Home
        </a>
    </div>

    <div class="error-page-container">
        <div class="error-card">
            <!-- 5-CHARACTER AUTHENTIC 4-FLAP SPLIT-FLAP DISPLAY -->
            <div class="split-flap-container" id="split-flap-display"></div>

            <h1 class="error-title">Trajectory Out of Bounds</h1>
            <p class="error-desc">
                The page or vector you are trying to reach does not exist or has been relocated. Return to Mission Control to navigate back on target.
            </p>

            <div class="error-actions">
                <a href="/" class="btn btn-primary" id="ng-home-action-link">
                    <i class="fa-solid fa-arrow-left"></i> Return to Mission Control
                </a>
                <a href="/contact" class="btn btn-secondary" id="ng-contact-action-link">
                    <i class="fa-regular fa-envelope"></i> Contact Support
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initSplitFlapText();
        });

        function initSplitFlapText() {
            const displayEl = document.getElementById('split-flap-display');
            if (!displayEl) return;

            const words = [" 404 ", "ERROR"];
            const charset = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ ";
            const padTo = 5;
            const flipsPerChar = 8;
            const stepDelay = 110; // ms
            const stagger = 60; // ms
            const cycleDelay = 3400; // ms

            const tileElements = [];
            displayEl.innerHTML = '';

            // Construct 5 physical 4-flap tile structures
            for (let i = 0; i < padTo; i++) {
                const initialChar = words[0][i] || ' ';

                const tile = document.createElement('div');
                tile.className = 'split-flap-tile';

                tile.innerHTML = `
                    <div class="flap top-static"><span>${initialChar}</span></div>
                    <div class="flap bottom-static"><span>${initialChar}</span></div>
                    <div class="flap flap-top"><span>${initialChar}</span></div>
                    <div class="flap flap-bottom"><span>${initialChar}</span></div>
                    <div class="center-line"></div>
                `;

                displayEl.appendChild(tile);

                tileElements.push({
                    tile: tile,
                    topStatic: tile.querySelector('.top-static span'),
                    bottomStatic: tile.querySelector('.bottom-static span'),
                    flapTop: tile.querySelector('.flap-top'),
                    flapTopSpan: tile.querySelector('.flap-top span'),
                    flapBottom: tile.querySelector('.flap-bottom'),
                    flapBottomSpan: tile.querySelector('.flap-bottom span'),
                    currentChar: initialChar
                });
            }

            let wordIdx = 0;

            function flipTileToChar(tileObj, targetChar, onComplete) {
                let flipStep = 0;
                let currentChar = tileObj.currentChar;

                function doSingleFlip() {
                    flipStep++;
                    let nextChar;

                    if (flipStep >= flipsPerChar) {
                        nextChar = targetChar;
                    } else {
                        nextChar = charset[Math.floor(Math.random() * (charset.length - 1))];
                    }

                    // Prepare 4 flaps for realistic physical flip:
                    // 1. top-static gets nextChar (revealed under top flap)
                    // 2. flap-top stays currentChar (folds down)
                    // 3. bottom-static stays currentChar
                    // 4. flap-bottom gets nextChar (unfolds down over bottom-static)
                    tileObj.topStatic.textContent = nextChar;
                    tileObj.flapTopSpan.textContent = currentChar;
                    tileObj.bottomStatic.textContent = currentChar;
                    tileObj.flapBottomSpan.textContent = nextChar;

                    // Trigger CSS 3D rotations
                    tileObj.flapTop.classList.remove('flipping');
                    tileObj.flapBottom.classList.remove('flipping');
                    void tileObj.flapTop.offsetWidth; // reflow

                    tileObj.flapTop.classList.add('flipping');
                    tileObj.flapBottom.classList.add('flipping');

                    tileObj.currentChar = nextChar;

                    setTimeout(() => {
                        // Reset flaps to static state
                        tileObj.bottomStatic.textContent = nextChar;
                        tileObj.flapTopSpan.textContent = nextChar;
                        tileObj.flapTop.classList.remove('flipping');
                        tileObj.flapBottom.classList.remove('flipping');

                        if (flipStep < flipsPerChar) {
                            setTimeout(doSingleFlip, 20);
                        } else {
                            if (onComplete) onComplete();
                        }
                    }, stepDelay);
                }

                doSingleFlip();
            }

            function animateToNextWord() {
                const nextWordIdx = (wordIdx + 1) % words.length;
                const targetWord = words[nextWordIdx].padEnd(padTo, ' ');

                tileElements.forEach((tileObj, colIdx) => {
                    const targetChar = targetWord[colIdx];
                    if (tileObj.currentChar === targetChar) return;

                    setTimeout(() => {
                        flipTileToChar(tileObj, targetChar);
                    }, colIdx * stagger);
                });

                wordIdx = nextWordIdx;
            }

            setInterval(animateToNextWord, cycleDelay);
        }

        // fix root-relative Home/Contact links to respect the deployment sub-path
        (function() {
            var basePath = window.__NG_BASE_PATH__ || '';
            if (!basePath) return;
            ['ng-home-logo-link', 'ng-home-btn-link', 'ng-home-action-link'].forEach(function(id) {
                var el = document.getElementById(id);
                if (el) el.setAttribute('href', basePath + '/');
            });
            var contactLink = document.getElementById('ng-contact-action-link');
            if (contactLink) contactLink.setAttribute('href', basePath + '/contact');
        })();
    </script>

</body>
</html>
