<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- pole -->
  <path d="M 5,33.2 C 4.7,24 5.4,14.5 4.8,4.6" stroke="#0A1C36" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <path d="M 5.5,31 C 5.3,23 5.8,15 5.4,6" stroke="#0A1C36" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.35"/>
  <!-- knob -->
  <circle cx="4.9" cy="4.1" r="1.5" fill="#FFE9A0" stroke="#0A1C36" stroke-width="0.6"/>
  <!-- pennant, attached just under the knob, billowing right with a soft wind-curved trailing edge -->
  <path d="M 5,6.3
           C 11,4.6 17,5.4 22.3,8.4
           C 17.6,10.1 17.8,12.6 22.3,14.6
           C 16.6,16.9 10.6,16.7 5,15.1
           Z"
        fill="#F3C319" stroke="#C99A0E" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- fold shadow near the pole for a bit of dimension -->
  <path d="M 5,7 C 8,7.6 10.4,8.8 11.6,10.6 C 10.2,12.2 7.8,13.4 5,14.2 Z"
        fill="#C99A0E" opacity="0.32"/>
</svg>